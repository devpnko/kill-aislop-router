name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The complete design/reference E2E intentionally exercises real child
    # processes, Playwright, crash recovery, and exact 3x3 lifecycle replay.
    # A clean Linux lane can exceed 20 minutes without being hung.
    timeout-minutes: 60
    env:
      KSR_PLAYWRIGHT_CHANNEL: bundled
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # The npm 10 clients bundled with Node 20/22 still call the retired
      # quick-audit endpoint. Pin one bulk-advisory client across both lanes.
      - run: npm install --global npm@11.19.0
      - run: npm --version
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install --with-deps chromium
        timeout-minutes: 10
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run pack:check
